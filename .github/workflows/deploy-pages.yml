name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm install

      - name: Build
        run: npm run build

      # Every guide page draws its section — a build can drop the section modules and still pass
      # (it did: `sideEffects` covered only the CSS, and the guide went blank). Not deployed if so.
      - run: npx playwright install --with-deps chromium
      - name: Guide renders
        run: npm run check:guide

      # axe over every guide page and the reference app — composition defects (an unlabelled select, a drawer
      # named by an empty header, two tables sharing a landmark name) pass every component suite. Judged
      # exceptions live in the script with their reasons.
      - name: Accessibility
        run: npm run check:a11y

      # The size ladder is owned by two packages — the components define sm / md / lg from the control density and
      # this sheet restyles the steps. Each side's own tests measure only itself; the rendered composition is where a
      # step can come out smaller than the one below it at a raised density. Not deployed if so.
      - name: Control ladder
        run: npm run check:ladder

      - name: SPA fallback (client-side routing, guide + reference app)
        run: |
          cat > publish/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="UTF-8" /></head>
            <body>
              <script>
                (function () {
                  var base = '/house-style/';
                  var isApp = location.pathname.indexOf(base + 'app/') === 0;
                  var target = location.origin + base + (isApp ? 'app/index.html' : 'index.html');
                  fetch(target).then(function (r) { return r.text(); }).then(function (html) {
                    document.open();
                    document.write(html);
                    document.close();
                  });
                })();
              </script>
            </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish
          retention-days: 1

  # The landing page's "Start here" path, run in a fresh project against the published packages.
  # A guide whose copy-paste path does not render a screen is not deployed.
  # It runs twice: with this commit's house-style packed from the working tree (what the next tag
  # would ship — a push to main comes before the tag, so this is the warning before a release),
  # then with the registry's packages (what a reader gets today). Both report even if one fails.
  start-here:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Start here — this commit's house-style
        run: npm run check:start-here:local

      - name: Start here — published packages
        if: success() || failure()
        run: npm run check:start-here

  deploy:
    needs: [build, start-here]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
