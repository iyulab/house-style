name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm install

      - name: Build
        run: npm run build

      - name: SPA fallback (client-side routing, guide + reference app)
        run: |
          cat > publish/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="UTF-8" /></head>
            <body>
              <script>
                (function () {
                  var base = '/house-style/';
                  var isApp = location.pathname.indexOf(base + 'app/') === 0;
                  var target = location.origin + base + (isApp ? 'app/index.html' : 'index.html');
                  fetch(target).then(function (r) { return r.text(); }).then(function (html) {
                    document.open();
                    document.write(html);
                    document.close();
                  });
                })();
              </script>
            </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish
          retention-days: 1

  # The landing page's "Start here" path, run in a fresh project against the published packages.
  # A guide whose copy-paste path does not render a screen is not deployed.
  start-here:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm run check:start-here

  deploy:
    needs: [build, start-here]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
